# Local setup: PostgreSQL 18 on localhost:5432, database "leave_management", user/password postgres/postgres.
# Every value can be overridden with the environment variable named in ${VAR:default}.
spring:
  application:
    name: management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      # Creates/updates tables on startup; use Flyway/Liquibase migrations in production.
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  # 8080 is taken by the local Oracle TNS listener.
  port: ${SERVER_PORT:8081}

# Default admin account created on first start (only if no ADMIN exists).
app:
  admin:
    name: ${ADMIN_NAME:System Admin}
    email: ${ADMIN_EMAIL:admin@company.com}
    password: ${ADMIN_PASSWORD:admin123}
